[workspace]
resolver = "3"
members = [
    "crates/shelfcheck-core",
    "crates/shelfcheck-report",
    "crates/shelfcheck-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# quick-xml 0.42 needs Rust 1.86.
rust-version = "1.86"
license = "Apache-2.0"
# Placeholder: set to the real GitHub repository before the first release.
# dist needs it for installers and the Homebrew formula.
repository = "https://github.com/logitsolutionsai/shelfcheck"
homepage = "https://logitsolutions.ai/guides/ai-in-ecommerce/"
authors = ["Logit Solutions AI"]

[workspace.dependencies]
shelfcheck-core = { path = "crates/shelfcheck-core", version = "0.1.0" }
shelfcheck-report = { path = "crates/shelfcheck-report", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
quick-xml = "0.42"
jsonschema = { version = "0.61", default-features = false }
rust_decimal = "1.43"
strsim = "0.11"
rayon = "1.12"
regex = "1.13"
toml = "1.2"
thiserror = "2"
sha2 = "0.10"
minijinja = "3.1"
quick-junit = "0.8"
clap = { version = "4.6", features = ["derive"] }

# dev
tempfile = "3"
proptest = "1"
insta = "1"

# Profile used by `dist` for release binaries.
[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
codegen-units = 1

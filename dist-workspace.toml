# dist (cargo-dist 0.34): release binaries, shell and PowerShell installers,
# an npm package (npx shelfcheck) and a Homebrew formula.
# Nothing is published until a version tag is pushed with the release
# workflow in place. Before the first release:
#   1. set `repository` in Cargo.toml and `tap` below to the real GitHub names;
#   2. run `dist generate` to write .github/workflows/release.yml;
#   3. add the HOMEBREW_TAP_TOKEN and NPM_TOKEN secrets (names as dist documents them).

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = ["github"]
installers = ["shell", "powershell", "npm", "homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Placeholder: the Homebrew tap repository, which must exist before release.
tap = "logitsolutionsai/homebrew-tap"
publish-jobs = ["homebrew", "npm"]
npm-package = "shelfcheck"
install-path = "CARGO_HOME"
pr-run-mode = "plan"
# Copied into the root of every release archive, next to README, LICENSE and
# CHANGELOG (which dist adds by itself). Generated by cargo-about from
# about.toml and about.hbs; the CI job "Third-party licence notice" fails
# when it is out of date.
include = ["THIRD-PARTY-LICENSES.html"]

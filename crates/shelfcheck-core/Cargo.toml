[package]
name = "shelfcheck-core"
description = "Record model, feed readers, rule engine and diff for shelfcheck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["product-feed", "gtin", "ecommerce", "validator"]
categories = ["development-tools"]
# The rule packs and the vendored ACP schema are embedded from `rules/` in
# this crate, a copy of the workspace's `rules/` made by
# scripts/sync-crate-data.sh (tests/crate_data.rs fails while they differ).
include = ["src/**/*", "rules/**/*", "tests/**/*", "LICENSE", "NOTICE", "Cargo.toml"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
quick-xml.workspace = true
jsonschema.workspace = true
rust_decimal.workspace = true
strsim.workspace = true
rayon.workspace = true
regex.workspace = true
toml.workspace = true
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

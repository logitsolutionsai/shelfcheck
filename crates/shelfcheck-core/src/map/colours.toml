blue = ["blue", "blu"]
navy = ["navy", "navy blue", "nvy"]
green = ["green", "grn"]
yellow = ["yellow", "ylw", "yel"]
orange = ["orange", "org"]
pink = ["pink", "pnk"]
purple = ["purple", "prp", "ppl"]
brown = ["brown", "brn"]
beige = ["beige", "bge"]
gold = ["gold", "gld"]
